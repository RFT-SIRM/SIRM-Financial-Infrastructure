[package]
name = "sirm-codec"
version = "0.0.1"
edition = "2021"
description = "Reference Rust codec for the SIRM canonical request encoding v0 (proposal)"
license = "BUSL-1.1"
publish = false

[dependencies]
sirm-keys-core = { path = "../sirm-keys-core" }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"

# Optimise only the cryptographic dependencies in test builds: unoptimised curve arithmetic makes the signature
# tests slow, while the crate's own code keeps debug assertions and overflow checks.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
