[package]
name = "sirm-codec"
version = "0.0.1"
edition = "2021"
description = "Reference Rust codec for the SIRM canonical request encoding v0 (proposal)"
license = "Apache-2.0"
publish = false

[dependencies]
sirm-keys-core = { path = "../sirm-keys-core" }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
